org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's relocatable incremental cache fails when a Windows Pub cache and
# checkout are on different drives. Full Kotlin compilation preserves builds
# without modifying the user's shared Pub cache or generated plugin sources.
kotlin.incremental=false
# App defaultConfig derives ABI filters from the requested Flutter targets.
disable-abi-filtering=true
# All GitHub APK variants use the common code; never add Flutter ABI offsets.
force-version-code-ignoring-abi=true
