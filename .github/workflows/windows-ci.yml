name: Windows checks

on:
  workflow_call:
    secrets:
      GOOGLE_DRIVE_RELEASE_CONFIG:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record checked-out source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .buildlog/verification | Out-Null
          "Commit: $(git rev-parse HEAD); Ref: $env:GITHUB_REF" | Set-Content .buildlog/verification/windows-source.log
      - name: Install and verify pinned Inno Setup before app checks
        shell: pwsh
        run: ./tools/install-inno-setup-ci.ps1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        shell: pwsh
        run: |
          flutter analyze --no-pub 2>&1 | Tee-Object .buildlog/verification/windows-analysis.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Flutter tests
        shell: pwsh
        run: |
          flutter test --no-pub --concurrency=1 2>&1 | Tee-Object .buildlog/verification/windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate developer routes and verification helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .buildlog/verification | Out-Null
          python -m unittest discover -s tools -p test_dev_verify.py 2>&1 | Tee-Object .buildlog/verification/windows-developer-tools.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p test_background_sync_schema.py 2>&1 | Tee-Object .buildlog/verification/windows-background-schema.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check public OAuth configuration and packaging gates
        shell: pwsh
        run: ./tools/test-google-drive-release-config.ps1
      - name: Load approved Desktop Drive release configuration
        shell: pwsh
        env:
          DRIVE_BUILD_CONFIG: ${{ secrets.GOOGLE_DRIVE_RELEASE_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DRIVE_BUILD_CONFIG)) {
            throw 'The approved GOOGLE_DRIVE_RELEASE_CONFIG secret is required for enabled release packaging.'
          }
          $driveConfigPath = Join-Path $env:RUNNER_TEMP 'todorbit-drive-build.json'
          [System.IO.File]::WriteAllText($driveConfigPath, $env:DRIVE_BUILD_CONFIG, [System.Text.UTF8Encoding]::new($false))
          . ./tools/google-drive-release-config.ps1
          $driveConfig = Read-GoogleDriveReleaseConfig $driveConfigPath
          if (-not $driveConfig.GOOGLE_DRIVE_ENABLED) { throw 'Release packaging requires the approved enabled configuration.' }
          "TODORBIT_GOOGLE_DRIVE_CONFIG=$driveConfigPath" >> $env:GITHUB_ENV
      - name: Build Windows Release
        shell: pwsh
        run: ./tools/build-windows-release.ps1
      - name: Verify C++ runtime packaging gates
        shell: pwsh
        run: ./tools/test-windows-crt.ps1
      - name: Build portable package with audited OAuth configuration
        shell: pwsh
        run: ./tools/build-portable.ps1
      - name: Verify native sync writer with a disposable migrated profile
        shell: pwsh
        run: |
          $env:TODORBIT_NATIVE_SYNC_EXECUTABLE = (Resolve-Path 'build/windows/x64/runner/Release/TodorbitWidget.exe').Path
          flutter test --no-pub --concurrency=1 test_driver/native_sync_writer_test.dart
      - name: Verify hidden background sync barriers
        shell: pwsh
        run: python tools/test-background-sync.py --executable build/windows/x64/runner/Release/Todorbit.exe
      - name: Native widget self-test in disposable profile
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'TodorbitCI\Roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'TodorbitCI\Local'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $selfTest = Start-Process -FilePath (Resolve-Path 'build\windows\x64\runner\Release\TodorbitWidget.exe').Path -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) { exit $selfTest.ExitCode }
      - name: Compile installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Compiler $env:TODORBIT_ISCC
      - name: Release candidate checksums
        shell: pwsh
        run: ./tools/write-release-checksums.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-candidate
          path: release/*
          if-no-files-found: error
      - name: Upload Windows host diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .buildlog/verification/windows-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary build configuration
        if: always()
        shell: pwsh
        run: |
          $driveConfigPath = Join-Path $env:RUNNER_TEMP 'todorbit-drive-build.json'
          if (Test-Path -LiteralPath $driveConfigPath) { Remove-Item -LiteralPath $driveConfigPath -Force }
