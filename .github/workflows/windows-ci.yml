name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test --concurrency=1
      - name: Check public OAuth configuration and packaging gates
        shell: pwsh
        run: ./tools/test-google-drive-release-config.ps1
      - name: Build Windows Release
        shell: pwsh
        run: ./tools/build-windows-release.ps1
      - name: Build portable package with audited OAuth configuration
        shell: pwsh
        run: ./tools/build-portable.ps1
      - name: Native widget self-test in disposable profile
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'TodorbitCI\Roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'TodorbitCI\Local'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $selfTest = Start-Process -FilePath (Resolve-Path 'build\windows\x64\runner\Release\TodorbitWidget.exe').Path -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) { exit $selfTest.ExitCode }
      - name: Install Inno Setup 7
        shell: pwsh
        run: choco install innosetup --version=7.1.0 --yes --no-progress --allow-downgrade
      - name: Compile installer
        shell: pwsh
        run: ./installer/build-installer.ps1
      - name: Release candidate checksums
        shell: pwsh
        run: ./tools/write-release-checksums.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate
          path: release/*
          if-no-files-found: error
