name: Windows checks

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify pinned Inno Setup before app checks
        shell: pwsh
        run: ./tools/install-inno-setup-ci.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test --concurrency=1
      - name: Validate developer routes and verification helper
        run: python -m unittest discover -s tools -p test_dev_verify.py
      - name: Check public OAuth configuration and packaging gates
        shell: pwsh
        run: ./tools/test-google-drive-release-config.ps1
      - name: Build Windows Release
        shell: pwsh
        run: ./tools/build-windows-release.ps1
      - name: Verify C++ runtime packaging gates
        shell: pwsh
        run: ./tools/test-windows-crt.ps1
      - name: Build portable package with audited OAuth configuration
        shell: pwsh
        run: ./tools/build-portable.ps1
      - name: Verify native sync writer with a disposable migrated profile
        shell: pwsh
        run: |
          $env:TODORBIT_NATIVE_SYNC_EXECUTABLE = (Resolve-Path 'build/windows/x64/runner/Release/TodorbitWidget.exe').Path
          flutter test --no-pub --concurrency=1 test_driver/native_sync_writer_test.dart
      - name: Verify hidden background sync barriers
        shell: pwsh
        run: python tools/test-background-sync.py --executable build/windows/x64/runner/Release/Todorbit.exe --schema 26
      - name: Native widget self-test in disposable profile
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'TodorbitCI\Roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'TodorbitCI\Local'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $selfTest = Start-Process -FilePath (Resolve-Path 'build\windows\x64\runner\Release\TodorbitWidget.exe').Path -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) { exit $selfTest.ExitCode }
      - name: Compile installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Compiler $env:TODORBIT_ISCC
      - name: Release candidate checksums
        shell: pwsh
        run: ./tools/write-release-checksums.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate
          path: release/*
          if-no-files-found: error
