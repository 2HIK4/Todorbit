name: Android validation
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, 'feature/android-*']
    paths: ['lib/**', 'android/**', 'test/**', 'integration_test/**', 'test_driver/**', 'pubspec.*', '.github/workflows/android-ci.yml', 'tools/build-android.ps1', 'tools/verify-android-artifact.py', 'tools/*android*', 'tools/dev/**', 'tools/test_dev_verify.py', 'tools/VerifyAndroidBundle.java', 'tools/test_prepare_android_release.py', '.github/workflows/android-release.yml']
  pull_request:
    paths: ['lib/**', 'android/**', 'test/**', 'integration_test/**', 'test_driver/**', 'pubspec.*', '.github/workflows/android-ci.yml', 'tools/build-android.ps1', 'tools/verify-android-artifact.py', 'tools/*android*', 'tools/dev/**', 'tools/test_dev_verify.py', 'tools/VerifyAndroidBundle.java', 'tools/test_prepare_android_release.py', '.github/workflows/android-release.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - run: flutter pub get
      # Windows CI remains the independent full-analysis/full-host-suite gate
      # on every push/PR. Signed candidates require both workflows.
      - run: flutter analyze --no-pub lib/platform/android lib/features/mobile integration_test test_driver/android_update_app.dart
      - run: flutter test --no-pub --concurrency=1 test/android_platform_test.dart test/android_google_drive_auth_test.dart test/android_update_service_test.dart test/android_software_updates_page_test.dart test/mobile_workspace_test.dart test/mobile_editors_test.dart test/cross_platform_backup_test.dart
      - run: python -m unittest discover -s tools -p test_prepare_android_release.py
      - run: flutter build apk --debug --flavor github --target-platform android-arm64,android-x64
      - run: python tools/verify-android-artifact.py build/app/outputs/flutter-apk/app-github-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Todorbit-Android-development-only
          path: build/app/outputs/flutter-apk/app-github-debug.apk
          retention-days: 14
  android-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/test-android-update-ci.sh
