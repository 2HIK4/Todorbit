name: Android 16 KiB artifact runtime
on:
  push:
    branches: [feature/android-mobile]
    paths: ['.github/workflows/android-16k-runtime.yml']
  workflow_dispatch:
    inputs:
      beta26_testing_downloads:
        description: Copy verified Beta 26 packages to Actions without running the emulator
        type: boolean
        default: false
      asset_id:
        description: Existing GitHub x64 APK asset ID (draft allowed)
        required: true
      sha256:
        description: Expected APK SHA-256 from the validated candidate
        required: true
      previous_asset_id:
        description: Optional previous production x64 APK for in-place upgrade acceptance
        required: false
      previous_sha256:
        description: Expected previous APK SHA-256 (required with previous_asset_id)
        required: false
permissions:
  # GitHub requires push access to read unpublished release assets. This trusted
  # artifact-only job makes no repository/release write calls and has no signing keys.
  contents: write
  actions: read
jobs:
  runtime:
    if: "!inputs.beta26_testing_downloads && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[16k-runtime]'))"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Retrieve and verify existing artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id || '695758240' }}
          APK_SHA256: ${{ inputs.sha256 || '7c348bc0286eb9c9134698426a9569d9f9a264063c559c196da5a4a2fdd42d74' }}
          PREVIOUS_ASSET_ID: ${{ inputs.previous_asset_id }}
          PREVIOUS_APK_SHA256: ${{ inputs.previous_sha256 }}
        run: |
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p .buildlog/16k-runtime
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" -H 'Accept: application/octet-stream' > .buildlog/16k-runtime/candidate.apk
          echo "$APK_SHA256  .buildlog/16k-runtime/candidate.apk" | sha256sum -c -
          if [[ -n "$PREVIOUS_ASSET_ID" || -n "$PREVIOUS_APK_SHA256" ]]; then
            [[ "$PREVIOUS_ASSET_ID" =~ ^[0-9]+$ ]]
            [[ "$PREVIOUS_APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$PREVIOUS_ASSET_ID" -H 'Accept: application/octet-stream' > .buildlog/16k-runtime/previous.apk
            echo "$PREVIOUS_APK_SHA256  .buildlog/16k-runtime/previous.apk" | sha256sum -c -
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_SHA256: ${{ inputs.sha256 || '7c348bc0286eb9c9134698426a9569d9f9a264063c559c196da5a4a2fdd42d74' }}
          PREVIOUS_APK_SHA256: ${{ inputs.previous_sha256 }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis_ps16k
          emulator-build: '16740729'
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: python tools/android-16k-runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-16KiB-runtime-evidence
          path: |
            .buildlog/16k-runtime/*.json
            .buildlog/16k-runtime/*.log
            .buildlog/16k-runtime/*.xml
            .buildlog/16k-runtime/*.png
          retention-days: 14
  beta26-downloads:
    name: Verified Beta 26 manual-testing downloads
    if: github.event_name == 'workflow_dispatch' && inputs.beta26_testing_downloads
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Copy and verify the existing candidate packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_commit=ace8b3d25b2e760dde189cdabd7defa29035c7ea
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44927010386" |
            jq -e --arg sha "$source_commit" '.head_sha == $sha and .conclusion == "success"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/453847236" |
            jq -e --arg sha "$source_commit" '.draft and .prerelease and .target_commitish == $sha and any(.assets[]; .id == 776268493)' >/dev/null
          mkdir -p downloads/{setup,portable,android}
          gh run download 44927010386 --repo "$GITHUB_REPOSITORY" --name windows-release-candidate --dir windows
          mv windows/Todorbit-1.0.19-beta.26-win-x64-setup.exe downloads/setup/
          mv windows/Todorbit-1.0.19-beta.26-win-x64-portable.zip downloads/portable/
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/776268493" -H 'Accept: application/octet-stream' > downloads/android/Todorbit-1.0.19-beta.26-android-universal.apk
          verify() {
            local folder="$1" file="$2" hash="$3"
            (cd "downloads/$folder" && printf '%s  %s\n' "$hash" "$file" | tee SHA256SUMS.txt | sha256sum --check)
          }
          verify setup Todorbit-1.0.19-beta.26-win-x64-setup.exe bf6ea346bae7becf7202fb6cc5e2a524e65dfadf137243fabfae38b53f5331a2
          verify portable Todorbit-1.0.19-beta.26-win-x64-portable.zip 43d70d1fc3f2a1b01e9c53657587b08e25b28e63630e72233d1790df28befdc3
          verify android Todorbit-1.0.19-beta.26-android-universal.apk 0a3fb0f09d490d6e6bbd457988fa9ca238f460cfbaf01d0cecb33344799d6d1f
          {
            echo '## Todorbit Beta 26 experimental manual testing'
            echo 'Build 1.0.19-beta.26+49, source `ace8b3d25b2e760dde189cdabd7defa29035c7ea`.'
            echo 'Registered Windows installer upgrade, physical Windows and Android acceptance, and live two-client Drive sync and recovery remain unverified.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Todorbit-beta26-Windows-installer
          path: downloads/setup/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Todorbit-beta26-Windows-portable
          path: downloads/portable/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Todorbit-beta26-Android-universal
          path: downloads/android/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
