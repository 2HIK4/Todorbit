name: Website preview checks and approved deployment

on:
  push:
    paths:
      - 'website/**'
      - '**/*.md'
      - 'docs/screenshots/**'
      - 'assets/app_icon.png'
      - 'tools/dev/*check*docs*.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - '**/*.md'
      - 'docs/screenshots/**'
      - 'assets/app_icon.png'
      - 'tools/dev/*check*docs*.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      publish_approved:
        description: 'Publish only after the owner has explicitly approved these pages and the target domain.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools/dev -p test_check_docs.py
      - run: python tools/dev/check-docs.py
      - run: python website/verify.py
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_approved == true && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: website/dist
      - name: Deploy approved website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
